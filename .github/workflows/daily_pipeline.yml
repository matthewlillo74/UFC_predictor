name: Daily pipeline (score completed events, predict upcoming)

# Runs once a day: scores any newly-completed events (via the pipeline's
# built-in auto-scorer), enriches new fighters, retrains if 10+ new events
# have accumulated (existing project convention, not overridden here), and
# generates predictions for the next upcoming card. This is the automated
# equivalent of manually running scripts/run_pipeline.py — see README.md's
# "Workflow" section for what each step does.
#
# Closing-line capture is normally handled by the separate
# closing_odds_poll.yml workflow (every 15 min during the live-event
# window). This file also carries a closing-odds-fallback job (below) —
# see that job for why.

on:
  schedule:
    - cron: "0 14 * * *"    # 14:00 UTC daily — the main pipeline run
    - cron: "30 22 * * 6"   # Saturday 22:30 UTC — closing-odds fallback checkpoint #1
    - cron: "30 2 * * 0"    # Sunday 02:30 UTC — closing-odds fallback checkpoint #2
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-pipeline:
    # Only the main daily cron (or a manual trigger) runs the full pipeline —
    # the two fallback-checkpoint crons below exist purely to give
    # closing-odds-fallback a reason to fire at those times, not to re-run
    # scraping/retraining/predicting three times a day.
    if: github.event_name != 'schedule' || github.event.schedule == '0 14 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 120   # fighter enrichment can take a while on a big backlog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Steps below use continue-on-error so one hiccup (e.g. a scoring edge
      # case, a transient email failure) doesn't block the rest of the run —
      # in particular, the DB commit at the end should still happen even if
      # an earlier step had a problem. BUT continue-on-error also makes
      # GitHub treat the whole workflow as "successful," which silently
      # disables the free failure-notification email GitHub sends by default
      # on failed scheduled runs. The "Fail the job if anything errored"
      # step at the end restores that: every step still runs to completion,
      # but the job still reports failure overall if anything did, so a
      # real problem doesn't go unnoticed for months.

      - name: Run pipeline (post-event scoring)
        id: post_event
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/run_pipeline.py --post-event
        continue-on-error: true

      - name: Run pipeline (scrape / enrich / retrain-if-due / predict)
        id: main_run
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/run_pipeline.py

      - name: Compute style vulnerability
        id: style_vuln
        run: python scripts/compute_style_vulnerability.py
        continue-on-error: true

      - name: Email results report (only sends if a new event was scored)
        id: email_report
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: python scripts/email_report.py
        continue-on-error: true

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/ models_saved/; then
            echo "No changes to commit"
          else
            git add -f data/ufc_predictor.db data/processed/ data/predictions/ models_saved/
            git commit -m "chore: daily pipeline run [automated]"
            # Retry on push rejection -- three workflow files independently
            # commit to data/ufc_predictor.db and can genuinely overlap
            # during the live-event window. A single pull+push attempt has
            # no way to recover from a collision; retrying with a fresh
            # rebase does.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin main && break
              echo "Push attempt $i failed (likely a race with another workflow) -- retrying"
              sleep $((RANDOM % 10 + 5))
            done
          fi

      - name: Fail the job if anything errored (restores GitHub's default failure email)
        if: |
          steps.post_event.outcome == 'failure' ||
          steps.style_vuln.outcome == 'failure' ||
          steps.email_report.outcome == 'failure'
        run: |
          echo "One or more non-blocking steps failed this run — see logs above. Failing the job so it shows up as a failed run / triggers GitHub's failure notification."
          exit 1

  closing-odds-fallback:
    # needs + if: always() — NOT for ordering semantics (this job should run
    # whether run-pipeline succeeds, fails, or is skipped on the fallback-only
    # crons) but to force GitHub to run these two jobs sequentially rather
    # than in parallel. Both jobs commit to data/ufc_predictor.db; running
    # them concurrently on the main 14:00 UTC trigger (where both jobs are
    # active) would risk a git push race — the exact "fetch first, rejected"
    # conflict this project has already hit manually more than once this
    # week, just automated and harder to notice.
    needs: run-pipeline
    if: always()
    #
    # Redundant, independently-scheduled attempt at closing-odds capture.
    #
    # WHY THIS EXISTS: closing_odds_poll.yml's first live run (2026-07-18)
    # never captured anything — not because the capture logic was wrong, but
    # because GitHub's schedule trigger for that workflow drifted badly under
    # load (real gaps of 1-3 hours against a configured 15 min), and the old
    # 24-minute target window was too narrow to survive that. Widening the
    # window in maybe_capture_closing.py (see its docstring) helps, but
    # doesn't fully solve a scheduler that's inherently best-effort — if
    # closing_odds_poll.yml itself fails to fire at all some week (its own
    # bug, its own scheduling bad luck), a wider window in the same
    # workflow doesn't help. This job is the redundancy: a completely
    # separate workflow file with its own cron registration, firing at
    # 22:30 UTC Saturday and 02:30 UTC Sunday (see the schedule block
    # above) — late enough to be past the T-30 deadline for essentially any
    # realistic UFC start time, so if the primary poller already captured,
    # this just confirms and no-ops (maybe_capture_closing.py is
    # idempotent); if it didn't, this is the safety net.
    #
    # Runs on every trigger of this workflow (the main 14:00 UTC daily run
    # included) rather than being gated to just the two fallback crons —
    # it's cheap and self-gating, so there's no reason to exclude it
    # elsewhere, and an extra early check doesn't hurt.
    #
    # Also skips entirely on UFC off weeks via scripts/is_ufc_weekend.py
    # (same gate as the other two polling workflows) — otherwise this job
    # would burn an Odds API call every trigger, every day, forever,
    # regardless of whether there's ever a card to check for.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check whether there's a UFC event this weekend (skip everything else if not)
        id: check_event
        run: |
          if python scripts/is_ufc_weekend.py; then
            echo "has_event=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_event=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt closing-odds capture (no-ops if already captured or not yet time)
        if: steps.check_event.outputs.has_event == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/maybe_capture_closing.py

      - name: Commit and push if the DB changed
        if: steps.check_event.outputs.has_event == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/ufc_predictor.db; then
            echo "No changes to commit"
          else
            git add -f data/ufc_predictor.db
            git commit -m "chore: closing-odds fallback capture [automated]"
            # Retry on push rejection -- confirmed 2026-07-25: this job's
            # push collided with closing_odds_poll.yml's, which fired 8
            # minutes earlier the same day. needs+if:always() above only
            # sequences this job against run-pipeline WITHIN this workflow
            # file; it does nothing against the other two workflow files
            # also writing to this same DB, which is the collision that
            # actually happened. A single pull+push attempt can't recover
            # from that; retrying with a fresh rebase does.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin main && break
              echo "Push attempt $i failed (likely a race with another workflow) -- retrying"
              sleep $((RANDOM % 10 + 5))
            done
          fi
