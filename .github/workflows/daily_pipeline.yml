name: Daily pipeline (score completed events, predict upcoming)

# Runs once a day: scores any newly-completed events (via the pipeline's
# built-in auto-scorer), enriches new fighters, retrains if 10+ new events
# have accumulated (existing project convention, not overridden here), and
# generates predictions for the next upcoming card. This is the automated
# equivalent of manually running scripts/run_pipeline.py — see README.md's
# "Workflow" section for what each step does.
#
# Does NOT handle closing-line capture — that's time-sensitive (T-60 before
# first fight) and lives in the separate closing_odds_poll.yml workflow,
# which runs every 15 minutes instead of once a day.

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC daily — adjust if this collides with anything
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # fighter enrichment can take a while on a big backlog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Steps below use continue-on-error so one hiccup (e.g. a scoring edge
      # case, a transient email failure) doesn't block the rest of the run —
      # in particular, the DB commit at the end should still happen even if
      # an earlier step had a problem. BUT continue-on-error also makes
      # GitHub treat the whole workflow as "successful," which silently
      # disables the free failure-notification email GitHub sends by default
      # on failed scheduled runs. The "Fail the job if anything errored"
      # step at the end restores that: every step still runs to completion,
      # but the job still reports failure overall if anything did, so a
      # real problem doesn't go unnoticed for months.

      - name: Run pipeline (post-event scoring)
        id: post_event
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/run_pipeline.py --post-event
        continue-on-error: true

      - name: Run pipeline (scrape / enrich / retrain-if-due / predict)
        id: main_run
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/run_pipeline.py

      - name: Compute style vulnerability
        id: style_vuln
        run: python scripts/compute_style_vulnerability.py
        continue-on-error: true

      - name: Email results report (only sends if a new event was scored)
        id: email_report
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: python scripts/email_report.py
        continue-on-error: true

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/ models_saved/; then
            echo "No changes to commit"
          else
            git add -f data/ufc_predictor.db data/processed/ data/predictions/ models_saved/
            git commit -m "chore: daily pipeline run [automated]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Fail the job if anything errored (restores GitHub's default failure email)
        if: |
          steps.post_event.outcome == 'failure' ||
          steps.style_vuln.outcome == 'failure' ||
          steps.email_report.outcome == 'failure'
        run: |
          echo "One or more non-blocking steps failed this run — see logs above. Failing the job so it shows up as a failed run / triggers GitHub's failure notification."
          exit 1
