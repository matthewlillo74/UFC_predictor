name: Poll live results during UFC card, email card summary when it ends

# Runs every 15 minutes during the same Saturday-into-Sunday UTC window as
# closing_odds_poll.yml (see that file for why this specific window: covers
# international Saturday-afternoon cards through late US Saturday-night PPV
# main cards, which cross into Sunday UTC). Checks the current event's fight
# results as they land on ufcstats.com and updates the DB fight-by-fight as
# results come in, but only sends ONE email — once every fight on the card
# has concluded — with every pick vs. actual outcome for the whole event.
# (This is separate from daily_pipeline.yml -> scripts/email_report.py,
# which sends a broader once-a-day summary covering whatever was most
# recently scored, not scoped to "this card, right when it ends.")
#
# 15 min (not tighter) because the only thing that's time-sensitive is the
# one summary email at the very end — a few extra minutes' delay on that
# doesn't matter the way per-fight promptness would have.
#
# The window is wide enough to cover any UFC start time, but most cards
# don't start until hours after the window opens at 12:00 UTC. Rather than
# scrape ufcstats.com on every run regardless, scripts/live_results_poll.py
# gates its own scraping on whether closing odds have already been captured
# for this event (a free signal — closing_odds_poll.yml already sets it at
# T-60 min before the first fight, no extra API call needed here), with a
# time-based fallback in case that signal never arrives.
#
# scripts/live_results_poll.py has a hard safety requirement: only trusts a
# scraped fight as "concluded" if finish_round/finish_time are genuinely
# populated, since ufcstats.com's scraper otherwise defaults an unfought
# fight's method to "Decision" and winner to "fighter_a" with no explicit
# "hasn't happened yet" signal. Do not loosen that check without
# re-verifying against a real in-progress event page.
#
# UFC doesn't run every Saturday. scripts/is_ufc_weekend.py runs first as a
# cheap DB-only check and skips the scrape entirely on off weeks — see
# closing_odds_poll.yml for the same gate and why it's needed.

on:
  schedule:
    - cron: "*/15 12-23 * * 6"   # Saturday 12:00-23:59 UTC
    - cron: "*/15 0-6 * * 0"     # Sunday 00:00-06:59 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll-live-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check whether there's a UFC event this weekend (skip everything else if not)
        id: check_event
        run: |
          if python scripts/is_ufc_weekend.py; then
            echo "has_event=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_event=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Poll for newly-concluded fights, email card summary once it's over
        if: steps.check_event.outputs.has_event == 'true'
        id: poll
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: python scripts/live_results_poll.py

      - name: Commit and push if the DB changed
        if: steps.check_event.outputs.has_event == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/ufc_predictor.db data/predictions/; then
            echo "No changes to commit"
          else
            git add -f data/ufc_predictor.db data/predictions/
            git commit -m "chore: live results update [automated]"
            # Retry on push rejection -- three workflow files independently
            # commit to this same DB file and can genuinely overlap during
            # the live-event window (confirmed 2026-07-25 for the other two).
            # A single pull+push attempt has no way to recover from that.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin main && break
              echo "Push attempt $i failed (likely a race with another workflow) -- retrying"
              sleep $((RANDOM % 10 + 5))
            done
          fi
